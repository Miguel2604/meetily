name: Meety
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MeetyKit:
    path: MeetyKit
targets:
  Meety:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MeetyKit
        product: Core
      - package: MeetyKit
        product: Audio
      - package: MeetyKit
        product: Transcription
      - package: MeetyKit
        product: Summary
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Meety
        CFBundleDisplayName: Meety
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Meety records your microphone to transcribe meetings on this Mac.
        NSAudioCaptureUsageDescription: Meety captures system audio so the other side of the meeting is transcribed too.
    entitlements:
      path: App/Meety.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetily.ai
        PRODUCT_NAME: Meety
        MARKETING_VERSION: "0.5.0"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Meety:
    build:
      targets:
        Meety: all
    run:
      config: Debug
